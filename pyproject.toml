[project]
name = "mindeval"
version = "2.0.0"
description = "MindEval: a multi-session benchmark for AI mental-health counselors, played against a simulated patient."
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"
dependencies = [
    "litellm>=1.98.1",
    "pydantic>=2",
    "pyyaml>=6",
    "jinja2>=3.1",
    "jsonargparse[signatures]>=4.34.1",
    # The interaction runtime runs on NeMo UserSim's engine (mindeval/probe.py). Pinned to a commit: UserSim is
    # not on PyPI, and the probe relies on its probe contract and acall_llm as they are at this commit.
    "nemo-usersim @ git+https://github.com/NVIDIA-NeMo/UserSim@2945592c6d5b473c8b7158f432b16490a2d04aa0",
]

[project.optional-dependencies]
vertex = ["google-cloud-aiplatform>=1.38"]  # litellm's vertex_ai/ provider, e.g. Claude on Vertex as the patient

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # nemo-usersim, from git

[tool.hatch.build.targets.wheel]
packages = ["mindeval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E9", "F", "I"]
