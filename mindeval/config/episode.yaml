# The shape of a member's run of sessions: when they come back, the stretch of life in between, and
# how their concealment and affect move across sessions. Everything here is a seeded draw made once
# per member before the first session, keyed on the member and the seed and nothing else, so every
# counselor meets the same schedule. None of it is a model call. The weights are design choices,
# not measurements.

# Virtual spacing between turns inside a session, used for the session clock.
turn_spacing_minutes: 2.0

# The gap before each session after the first, in hours: draw a band, then uniform within it.
inter_episode_gap_hours:
  bands:
    - {range: [6, 24], p: 0.35}      # later the same day / overnight
    - {range: [24, 96], p: 0.40}     # a few days
    - {range: [96, 336], p: 0.25}    # up to two weeks

# Which of Ekman's six is nearest the surface in each session after the first (session 1 takes the
# member's from the profile file). Drawn independently per session: affect is weather, not a
# trajectory. Sadness and fear are the most common, and the rarer emotions are weighted high enough
# to appear.
session_affect:
  vocabulary:
    sadness:  0.30
    fear:     0.22
    anger:    0.16
    joy:      0.16
    surprise: 0.10
    disgust:  0.06

# How concealment opens across sessions, starting from the member's level in the profile file. Per
# level, a distribution over how many sessions the member stays there before stepping one level
# toward `low`; `never` holds the level for the rest of the run. Concealment only opens or holds.
concealment_schedule:
  dwell:
    high:   {"1": 0.10, "2": 0.30, "3": 0.30, "never": 0.30}
    medium: {"1": 0.20, "2": 0.35, "3": 0.20, "never": 0.25}
    low:    {"never": 1.0}    # already open; nowhere to go

# The calendar anchor: the weekday and hour the first session starts, so both sides can be told what
# day and time it is ("Thursday evening").
time_anchor:
  start_hour_bands:
    - {range: [7, 12],  p: 0.25}
    - {range: [12, 18], p: 0.35}
    - {range: [18, 23], p: 0.40}

# The shape of the stretch of life before each session after the first. The situation writer is
# asked to show it in what happened and never to name it.
episode_beats:
  vocabulary:
    setback:        {p: 0.20, gloss: "something they were counting on went worse, concretely"}
    plateau:        {p: 0.20, gloss: "nothing moved; the same weight, carried a few more days"}
    breakthrough:   {p: 0.10, gloss: "something genuinely eased or went better than feared"}
    rupture:        {p: 0.10, gloss: "a relationship or arrangement in their life broke or blew up"}
    external_event: {p: 0.20, gloss: "life intruded from outside the presenting problem entirely"}
    new_problem:    {p: 0.20, gloss: "a distinct new concern arrived and now competes for attention"}
