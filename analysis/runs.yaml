# The paper's counselor runs. Paths are relative to the runs root (--runs_root, or MINDEVAL_RUNS_ROOT).
#
# Every run plays the same 50 members (profiles sha256 464da37f…) with base seed 0, 3 sessions, at most 30 counselor
# replies a session, DeepSeek-V4.1-Flash as the patient. Two harness fingerprints are in the set: within one
# fingerprint every counselor meets the same schedule (gaps, beats, concealment, affect); across the two, the
# session-2 and session-3 schedules differ for some members. `fingerprint` is checked against each run.json.
#
# Judges: `own` is the verdicts each run was judged with when it was made (MindJudge-27B); the others are re-judgings
# of the same runs kept under <runs_root>/judging/<judge>/<key>/judge/mindeval2/.

runs:
  - {key: gpt56terra, label: GPT-5.6 Terra, path: mindeval2_counselors/gpt56terra, fingerprint: d4e680b4dd653883}
  - {key: gpt56sol, label: GPT-5.6 Sol, path: mindeval2_counselors/gpt56sol, fingerprint: d4e680b4dd653883}
  - {key: gpt56luna, label: GPT-5.6 Luna, path: mindeval2_counselors/gpt56luna, fingerprint: d4e680b4dd653883}
